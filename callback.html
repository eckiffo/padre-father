<!DOCTYPE html>
<html>
<head>
  <title>$PADRE Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: 'Courier New', monospace;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; padding: 24px; }
    .card { background: #111; border: 1px solid #222; border-radius: 8px;
            padding: 40px; max-width: 640px; width: 100%; text-align: center; }
    h1 { font-size: 22px; color: #00E676; margin-bottom: 8px; letter-spacing: .05em; }
    p  { color: #888; font-size: 13px; margin-bottom: 24px; }
    .code-box { background: #0a0a0a; border: 1px solid #00E676; border-radius: 6px;
                padding: 20px; font-size: 12px; color: #00E676; word-break: break-all;
                text-align: left; margin-bottom: 20px; line-height: 1.6; }
    .copy-btn { background: #00E676; color: #000; border: none; border-radius: 6px;
                padding: 12px 32px; font-size: 14px; font-weight: 700;
                cursor: pointer; letter-spacing: .05em; }
    .copy-btn:hover { background: #39FF14; }
    .ok { color: #00E676; font-size: 13px; margin-top: 12px; display: none; }
    .err { color: #ff4444; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✝ Auth Complete</h1>
    <p id="sub">Copy this code and paste it back into the terminal</p>
    <div class="code-box" id="code">reading…</div>
    <button class="copy-btn" onclick="copyCode()">Copy Code</button>
    <div class="ok" id="ok">✅ Copied!</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const code   = params.get('challengeCode') || params.get('code') || '';
    const el     = document.getElementById('code');

    if (code) {
      el.textContent = code;
    } else {
      el.textContent = '— no code in URL —';
      el.style.borderColor = '#ff4444';
      el.style.color = '#ff4444';
      document.getElementById('sub').textContent = 'Something went wrong — no challengeCode in the URL.';
    }

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        document.getElementById('ok').style.display = 'block';
        setTimeout(() => document.getElementById('ok').style.display = 'none', 2000);
      });
    }
  </script>
</body>
</html>
