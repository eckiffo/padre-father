<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PADRE Card Maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #eee; font-family: 'Cinzel', serif; display: flex; gap: 24px; padding: 24px; min-height: 100vh; flex-wrap: wrap; }

    #controls { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    #controls h2 { color: #FFD700; font-size: 16px; letter-spacing: 2px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 10px; color: #777; letter-spacing: 1px; text-transform: uppercase; }
    .field input, .field select, .field textarea {
      background: #111; border: 1px solid #2a2a2a; color: #eee;
      padding: 6px 9px; border-radius: 3px; font-family: 'Cinzel', serif; font-size: 11px; width: 100%;
    }
    .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #FFD700; }
    .row { display: flex; gap: 8px; }
    .row .field { flex: 1; }
    .divider { height: 1px; background: #1a1a1a; }

    #img-drop {
      border: 2px dashed #2a2a2a; border-radius: 4px; padding: 14px;
      text-align: center; cursor: pointer; font-size: 11px; color: #444; transition: all 0.2s;
    }
    #img-drop:hover, #img-drop.over { border-color: #FFD700; color: #FFD700; }
    #img-preview { max-width: 100%; max-height: 100px; display: none; margin: 0 auto 6px; }

    #quick-load { display: flex; flex-wrap: wrap; gap: 4px; max-height: 160px; overflow-y: auto; }
    #quick-load::-webkit-scrollbar { width: 3px; }
    #quick-load::-webkit-scrollbar-thumb { background: #333; }
    .qb {
      padding: 3px 7px; font-size: 9px; background: #111; border: 1px solid #222;
      color: #666; cursor: pointer; border-radius: 2px; transition: all 0.1s; font-family: 'Cinzel', serif;
    }
    .qb:hover { border-color: #FFD700; color: #FFD700; }

    .btn { padding: 9px 14px; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 1px; border: 1px solid #333; background: #111; color: #eee; cursor: pointer; border-radius: 3px; transition: all 0.15s; width: 100%; }
    .btn:hover { border-color: #FFD700; color: #FFD700; }
    .btn.gold { background: #FFD700; color: #000; border-color: #FFD700; font-weight: 700; }
    .btn.gold:hover { background: #fff; }

    #preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 300px; }
    #preview-area h2 { color: #FFD700; font-size: 14px; letter-spacing: 2px; }
    #card-canvas { border: 1px solid #222; image-rendering: pixelated; }
    #status { font-size: 10px; color: #555; letter-spacing: 1px; text-align: center; min-height: 16px; }

    .rarity-legend { display: flex; flex-direction: column; gap: 3px; }
    .rl { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #555; }
    .rl-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<div id="controls">
  <h2>⚔ CARD MAKER</h2>

  <div class="field">
    <label>Quick Load Card</label>
    <div id="quick-load"></div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>Card Art (drop or click)</label>
    <div id="img-drop">
      <img id="img-preview">
      <div id="img-hint">Drop artwork here or click to upload</div>
      <input type="file" id="img-file" accept="image/*" style="display:none">
    </div>
  </div>

  <div class="divider"></div>

  <div class="field"><label>Card Name</label><input id="f-name" value="Sigma Dev"></div>

  <div class="row">
    <div class="field">
      <label>Type</label>
      <select id="f-type">
        <option value="monster">Monster</option>
        <option value="blessing">Blessing</option>
        <option value="confession">Confession</option>
      </select>
    </div>
    <div class="field">
      <label>Attribute</label>
      <select id="f-attr">
        <option>DARK</option><option>LIGHT</option><option>CHAIN</option>
        <option>PAPER</option><option>DEGEN</option><option>VIRAL</option><option>MACHINE</option>
      </select>
    </div>
  </div>

  <div class="row" id="r-monster">
    <div class="field">
      <label>Stars</label>
      <input id="f-stars" type="number" value="8" min="1" max="12">
    </div>
    <div class="field">
      <label>Subtype</label>
      <select id="f-sub">
        <option>Normal</option><option selected>Effect</option>
        <option>Ritual/Effect</option><option>Flip/Effect</option><option>Token</option>
      </select>
    </div>
  </div>

  <div class="row" id="r-stats">
    <div class="field"><label>ATK</label><input id="f-atk" type="number" value="3000"></div>
    <div class="field"><label>DEF</label><input id="f-def" type="number" value="2500"></div>
  </div>

  <div class="field">
    <label>Rarity</label>
    <select id="f-rarity">
      <option value="c">Common [C]</option>
      <option value="r">Rare [R] — silver name</option>
      <option value="sr">Super Rare [SR] — holo art</option>
      <option value="ur">Ultra Rare [UR] — gold name + holo art</option>
      <option value="utr">Ultimate Rare [UtR] — embossed</option>
      <option value="scr" selected>Secret Rare [ScR] — rainbow + diagonal lines</option>
      <option value="gr">Ghost Rare [GR] — mirror art</option>
    </select>
  </div>

  <div class="field"><label>Effect Text</label>
    <textarea id="f-effect">Requires 2 Tributes. Cannot be targeted by card effects. When this card destroys a monster in battle: your opponent loses 500 Faith.</textarea>
  </div>

  <div class="row">
    <div class="field"><label>Card ID</label><input id="f-id" value="sigma_dev"></div>
    <div class="field"><label>Set No.</label><input id="f-set" value="PDRM-EN002"></div>
  </div>

  <button class="btn gold" onclick="CM.render()">RENDER CARD</button>
  <button class="btn" onclick="CM.download()">⬇ DOWNLOAD PNG</button>

  <div class="divider"></div>
  <div style="font-size:10px;color:#444;letter-spacing:1px">RARITY GUIDE</div>
  <div class="rarity-legend">
    <div class="rl"><div class="rl-dot" style="background:#888"></div>Common — plain</div>
    <div class="rl"><div class="rl-dot" style="background:#aaaacc"></div>Rare — silver name text</div>
    <div class="rl"><div class="rl-dot" style="background:#88aaff"></div>Super Rare — holographic art</div>
    <div class="rl"><div class="rl-dot" style="background:#FFD700"></div>Ultra Rare — gold name + holo art</div>
    <div class="rl"><div class="rl-dot" style="background:#FFD700;border:1px solid #fff"></div>Ultimate Rare — gold embossed + circles</div>
    <div class="rl"><div class="rl-dot" style="background:linear-gradient(90deg,#f0f,#0ff,#ff0);background:#ccccff"></div>Secret Rare — rainbow name + diagonal lines</div>
    <div class="rl"><div class="rl-dot" style="background:#FFD700;opacity:0.5"></div>Ghost Rare — mirror/transparent art</div>
  </div>
</div>

<div id="preview-area">
  <h2>CARD PREVIEW</h2>
  <canvas id="card-canvas" width="421" height="614"></canvas>
  <div id="status"></div>
</div>

<script src="js/cards-data.js"></script>
<script>
const CM = {
  art: null,

  // ── RARITY SYSTEM ─────────────────────────────────────────────────────────
  R: {
    c:   { nameFill: '#1a1a1a',  nameStroke: null,     outerBorder: ['#999','#777','#999'],  innerBorder: ['#ccc','#aaa','#ccc'],  artFx: 'none'     },
    r:   { nameFill: '#d0d0f0',  nameStroke: '#888aaa', outerBorder: ['#9999cc','#7777aa','#9999cc'], innerBorder: ['#bbbbd0','#9999bb','#bbbbd0'], artFx: 'none' },
    sr:  { nameFill: '#1a1a1a',  nameStroke: null,     outerBorder: ['#9999cc','#7777aa','#9999cc'], innerBorder: ['#bbbbd0','#9999bb','#bbbbd0'],  artFx: 'holo'     },
    ur:  { nameFill: '#FFD700',  nameStroke: '#8B6914', outerBorder: ['#FFD700','#b8960c','#FFD700'], innerBorder: ['#ffe566','#FFD700','#ffe566'],  artFx: 'holo'     },
    utr: { nameFill: '#FFD700',  nameStroke: '#8B6914', outerBorder: ['#FFD700','#b8960c','#FFD700'], innerBorder: ['#ffe566','#FFD700','#ffe566'],  artFx: 'embossed' },
    scr: { nameFill: '#e0e0ff',  nameStroke: '#8888cc', outerBorder: ['#ddddff','#aaaadd','#ddddff'], innerBorder: ['#eeeeff','#ccccff','#eeeeff'],  artFx: 'diagonal' },
    gr:  { nameFill: '#FFD700',  nameStroke: '#8B6914', outerBorder: ['#FFD700','#b8960c','#FFD700'], innerBorder: ['#ffe566','#FFD700','#ffe566'],  artFx: 'ghost'    },
  },

  // card body colours by type+subtype
  cardBg(type, sub) {
    if (type === 'blessing') return ['#1a3a1a','#2a5a2a','#1a3a1a'];
    if (type === 'confession') return ['#1a1a3a','#2a2a5a','#1a1a3a'];
    // monster
    const eff = ['effect','ritual/effect','flip/effect'];
    if (eff.includes((sub||'').toLowerCase())) return ['#5a2e08','#8B4513','#6b3810'];
    return ['#c8a840','#b89010','#d4b048']; // normal = yellow
  },

  attrColor: { DARK:'#5500aa', LIGHT:'#aa9900', CHAIN:'#cc3300', PAPER:'#0055aa', DEGEN:'#335500', VIRAL:'#005544', MACHINE:'#334466' },
  attrGlyph: { DARK:'闇', LIGHT:'光', CHAIN:'炎', PAPER:'水', DEGEN:'地', VIRAL:'風', MACHINE:'機' },

  // ── INIT ──────────────────────────────────────────────────────────────────
  init() {
    this.buildQuickLoad();
    this.bindDrop();
    document.getElementById('f-type').addEventListener('change', () => { this.toggleFields(); this.render(); });
    document.querySelectorAll('#controls input,#controls select,#controls textarea').forEach(el => el.addEventListener('input', () => this.render()));
    this.toggleFields();
    this.render();
  },

  buildQuickLoad() {
    const area = document.getElementById('quick-load');
    Object.values(PADRE_CARDS).forEach(card => {
      const b = document.createElement('button');
      b.className = 'qb'; b.textContent = card.name;
      b.addEventListener('click', () => this.loadCard(card));
      area.appendChild(b);
    });
  },

  loadCard(card) {
    document.getElementById('f-name').value = card.name;
    document.getElementById('f-type').value = card.type;
    document.getElementById('f-attr').value = card.attribute || 'DARK';
    document.getElementById('f-stars').value = card.stars || 4;
    const subMap = { normal:'Normal', effect:'Effect', ritual_effect:'Ritual/Effect', flip_effect:'Flip/Effect', token:'Token', ritual:'Ritual/Effect' };
    document.getElementById('f-sub').value = subMap[card.subtype] || 'Effect';
    document.getElementById('f-atk').value = card.atk ?? 0;
    document.getElementById('f-def').value = card.def ?? 0;
    const rarMap = { common:'c', rare:'r', ultra:'ur', secret:'scr' };
    document.getElementById('f-rarity').value = rarMap[card.rarity] || 'c';
    document.getElementById('f-effect').value = card.effect || '';
    document.getElementById('f-id').value = card.id;
    const idx = Object.keys(PADRE_CARDS).indexOf(card.id);
    document.getElementById('f-set').value = 'PDRM-EN' + String(idx+1).padStart(3,'0');
    // try load art
    if (card.image) {
      const img = new Image();
      img.onload = () => { this.art = img; this.setArtPreview(card.image); this.render(); };
      img.onerror = () => {};
      img.src = card.image;
    }
    this.toggleFields();
    this.render();
  },

  toggleFields() {
    const mon = document.getElementById('f-type').value === 'monster';
    document.getElementById('r-monster').style.display = mon ? 'flex' : 'none';
    document.getElementById('r-stats').style.display = mon ? 'flex' : 'none';
  },

  bindDrop() {
    const drop = document.getElementById('img-drop');
    const inp = document.getElementById('img-file');
    drop.addEventListener('click', () => inp.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) this.loadFile(e.dataTransfer.files[0]); });
    inp.addEventListener('change', e => { if (e.target.files[0]) this.loadFile(e.target.files[0]); });
  },

  loadFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => { this.art = img; this.render(); };
      img.src = e.target.result;
      this.setArtPreview(e.target.result);
    };
    reader.readAsDataURL(file);
  },

  setArtPreview(src) {
    const prev = document.getElementById('img-preview');
    prev.src = src; prev.style.display = 'block';
    document.getElementById('img-hint').textContent = 'Art loaded ✓';
  },

  // ── RENDER ────────────────────────────────────────────────────────────────
  render() {
    const cv = document.getElementById('card-canvas');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);

    const name   = document.getElementById('f-name').value || 'Card Name';
    const type   = document.getElementById('f-type').value;
    const attr   = document.getElementById('f-attr').value;
    const stars  = parseInt(document.getElementById('f-stars').value) || 4;
    const sub    = document.getElementById('f-sub').value;
    const atk    = document.getElementById('f-atk').value;
    const def    = document.getElementById('f-def').value;
    const rar    = document.getElementById('f-rarity').value;
    const effect = document.getElementById('f-effect').value;
    const setNo  = document.getElementById('f-set').value;
    const r      = this.R[rar] || this.R.c;
    const bg     = this.cardBg(type, sub);

    // ── OUTER FRAME ──────────────────────────────────────────────────────────
    const outerGrad = ctx.createLinearGradient(0, 0, W, H);
    outerGrad.addColorStop(0, r.outerBorder[0]);
    outerGrad.addColorStop(0.5, r.outerBorder[1]);
    outerGrad.addColorStop(1, r.outerBorder[2]);
    this.rr(ctx, 0, 0, W, H, 18);
    ctx.fillStyle = outerGrad; ctx.fill();

    // outer frame inner highlight
    this.rr(ctx, 2, 2, W-4, H-4, 16);
    ctx.strokeStyle = r.innerBorder[0]; ctx.lineWidth = 1.5; ctx.stroke();

    // ── CARD BODY ────────────────────────────────────────────────────────────
    const px = 12, py = 12;
    const bw = W - px*2, bh = H - py*2;
    this.rr(ctx, px, py, bw, bh, 10);
    const bgGrad = ctx.createLinearGradient(px, py, px, py+bh);
    bgGrad.addColorStop(0, bg[0]); bgGrad.addColorStop(0.5, bg[1]); bgGrad.addColorStop(1, bg[2]);
    ctx.fillStyle = bgGrad; ctx.fill();

    // ── NAME BANNER ──────────────────────────────────────────────────────────
    const nbY = py + 8, nbH = 32, nbX = px + 8, nbW = bw - 52;
    this.rr(ctx, nbX, nbY, nbW, nbH, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();

    // inner border line on name banner
    this.rr(ctx, nbX+1, nbY+1, nbW-2, nbH-2, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();

    // name text
    const fontSize = name.length > 18 ? 14 : name.length > 14 ? 16 : 18;
    ctx.font = `900 ${fontSize}px Cinzel`;
    ctx.textAlign = 'left';

    if (rar === 'scr') {
      // rainbow gradient name
      const rg = ctx.createLinearGradient(nbX+4, nbY, nbX+4+nbW, nbY);
      rg.addColorStop(0, '#ff88ff'); rg.addColorStop(0.25, '#88ffff');
      rg.addColorStop(0.5, '#ffff88'); rg.addColorStop(0.75, '#88ffff'); rg.addColorStop(1, '#ff88ff');
      ctx.fillStyle = rg;
    } else {
      ctx.fillStyle = r.nameFill;
    }

    if (r.nameStroke) {
      ctx.strokeStyle = r.nameStroke; ctx.lineWidth = 3;
      ctx.strokeText(name, nbX + 8, nbY + 22);
    }
    ctx.fillText(name, nbX + 8, nbY + 22);

    // ── ATTRIBUTE CIRCLE ─────────────────────────────────────────────────────
    const acX = px + bw - 36, acY = nbY + 2, acR = 15;
    ctx.beginPath(); ctx.arc(acX, acY + acR, acR, 0, Math.PI*2);
    const acGrad = ctx.createRadialGradient(acX, acY+acR, 2, acX, acY+acR, acR);
    const ac = this.attrColor[attr] || '#333';
    acGrad.addColorStop(0, this.lighten(ac, 70)); acGrad.addColorStop(1, ac);
    ctx.fillStyle = acGrad; ctx.fill();
    ctx.strokeStyle = r.outerBorder[0]; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px serif'; ctx.textAlign = 'center';
    ctx.fillText(this.attrGlyph[attr] || '?', acX, acY + acR + 5);

    // ── STARS ────────────────────────────────────────────────────────────────
    let artTopY = nbY + nbH + 6;
    if (type === 'monster') {
      const sc = Math.min(stars, 12);
      const sw = 20, sgap = 2;
      const totalW = sc * (sw + sgap) - sgap;
      let sx = (W - totalW) / 2;
      const sy = artTopY + 2;
      for (let i = 0; i < sc; i++) {
        this.drawStar(ctx, sx + sw/2, sy + sw/2, sw/2 - 1, '#cc4400', '#FFaa00');
        sx += sw + sgap;
      }
      artTopY += sw + 6;
    }

    // ── ART BOX ──────────────────────────────────────────────────────────────
    const ax = px + 10, aw = bw - 20;
    const ah = Math.round(aw * 0.73);
    const ay = artTopY;

    // art frame border (inner glow)
    const afGrad = ctx.createLinearGradient(ax, ay, ax+aw, ay+ah);
    afGrad.addColorStop(0, r.innerBorder[0]);
    afGrad.addColorStop(0.5, r.innerBorder[1]);
    afGrad.addColorStop(1, r.innerBorder[2]);
    this.rr(ctx, ax-4, ay-4, aw+8, ah+8, 4);
    ctx.fillStyle = afGrad; ctx.fill();

    // inner art frame shadow
    this.rr(ctx, ax-2, ay-2, aw+4, ah+4, 3);
    ctx.fillStyle = '#000'; ctx.fill();

    // clip for art
    this.rr(ctx, ax, ay, aw, ah, 2);
    ctx.save(); ctx.clip();

    if (this.art) {
      const ia = this.art.width / this.art.height;
      const ba = aw / ah;
      let dw, dh, dx, dy;
      if (ia > ba) { dh = ah; dw = ah * ia; dx = ax - (dw-aw)/2; dy = ay; }
      else { dw = aw; dh = aw / ia; dx = ax; dy = ay - (dh-ah)/2; }
      ctx.drawImage(this.art, dx, dy, dw, dh);
    } else {
      ctx.fillStyle = '#111'; ctx.fillRect(ax, ay, aw, ah);
      ctx.fillStyle = '#2a2a2a'; ctx.font = '13px Cinzel'; ctx.textAlign = 'center';
      ctx.fillText('[ ART ]', ax + aw/2, ay + ah/2);
    }

    // ── ART EFFECTS (rarity) ──────────────────────────────────────────────────
    if (r.artFx === 'holo') {
      // rainbow shimmer overlay
      const hg = ctx.createLinearGradient(ax, ay, ax+aw, ay+ah);
      hg.addColorStop(0,   'rgba(255,0,255,0.12)');
      hg.addColorStop(0.2, 'rgba(0,255,255,0.10)');
      hg.addColorStop(0.4, 'rgba(255,255,0,0.10)');
      hg.addColorStop(0.6, 'rgba(0,255,128,0.10)');
      hg.addColorStop(0.8, 'rgba(128,0,255,0.10)');
      hg.addColorStop(1,   'rgba(255,0,255,0.12)');
      ctx.fillStyle = hg; ctx.fillRect(ax, ay, aw, ah);
    } else if (r.artFx === 'diagonal') {
      // parallel diagonal lines (Secret Rare)
      ctx.strokeStyle = 'rgba(200,200,255,0.18)'; ctx.lineWidth = 1.5;
      for (let i = -ah; i < aw + ah; i += 12) {
        ctx.beginPath(); ctx.moveTo(ax + i, ay); ctx.lineTo(ax + i + ah, ay + ah); ctx.stroke();
      }
      // rainbow overlay
      const dg = ctx.createLinearGradient(ax, ay, ax+aw, ay+ah);
      dg.addColorStop(0,   'rgba(255,150,255,0.15)');
      dg.addColorStop(0.33,'rgba(150,255,255,0.12)');
      dg.addColorStop(0.66,'rgba(255,255,150,0.12)');
      dg.addColorStop(1,   'rgba(255,150,255,0.15)');
      ctx.fillStyle = dg; ctx.fillRect(ax, ay, aw, ah);
    } else if (r.artFx === 'embossed') {
      // parallel circles (Ultimate Rare)
      ctx.strokeStyle = 'rgba(255,215,0,0.15)'; ctx.lineWidth = 1;
      for (let cr = 10; cr < aw * 1.5; cr += 18) {
        ctx.beginPath(); ctx.arc(ax + aw*0.3, ay + ah*0.5, cr, 0, Math.PI*2); ctx.stroke();
      }
      // gold sheen
      const eg = ctx.createLinearGradient(ax, ay, ax+aw, ay+ah);
      eg.addColorStop(0, 'rgba(255,215,0,0.08)'); eg.addColorStop(0.5, 'rgba(255,215,0,0.15)'); eg.addColorStop(1, 'rgba(255,215,0,0.08)');
      ctx.fillStyle = eg; ctx.fillRect(ax, ay, aw, ah);
    } else if (r.artFx === 'ghost') {
      // Ghost Rare: semi-transparent white wash, art barely visible
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(ax, ay, aw, ah);
      // mirror sheen
      const gg = ctx.createLinearGradient(ax, ay, ax+aw, ay+ah);
      gg.addColorStop(0,   'rgba(255,215,0,0.2)');
      gg.addColorStop(0.4, 'rgba(255,255,255,0.3)');
      gg.addColorStop(0.6, 'rgba(255,215,0,0.15)');
      gg.addColorStop(1,   'rgba(200,200,255,0.2)');
      ctx.fillStyle = gg; ctx.fillRect(ax, ay, aw, ah);
    }

    ctx.restore();

    // ── TYPE LINE ────────────────────────────────────────────────────────────
    const tlY = ay + ah + 5;
    this.rr(ctx, ax, tlY, aw, 21, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 0.5; ctx.stroke();

    ctx.fillStyle = '#ddd'; ctx.font = '10px Cinzel'; ctx.textAlign = 'left';
    if (type === 'monster') {
      ctx.fillText(`[Degen / ${sub}]`, ax + 5, tlY + 14);
    } else if (type === 'blessing') {
      const bmap = {normal:'Normal Blessing',continuous:'Continuous Blessing',field:'Market Blessing',ritual:'Ritual Blessing'};
      ctx.fillText(`[${bmap[sub?.toLowerCase()]||'Blessing Card'}]`, ax + 5, tlY + 14);
    } else {
      const cmap = {normal:'Normal Confession',continuous:'Continuous Confession'};
      ctx.fillText(`[${cmap[sub?.toLowerCase()]||'Confession Card'}]`, ax + 5, tlY + 14);
    }

    // ── EFFECT BOX ───────────────────────────────────────────────────────────
    const ebY = tlY + 24;
    const atkH = type === 'monster' ? 22 : 0;
    const ebH = H - py - ebY - atkH - 22;
    this.rr(ctx, ax, ebY, aw, ebH, 2);
    ctx.fillStyle = 'rgba(255,255,220,0.07)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 0.5; ctx.stroke();

    // effect text
    ctx.fillStyle = '#ddd'; ctx.font = '10px "IM Fell English", serif'; ctx.textAlign = 'left';
    this.wrapText(ctx, effect, ax+5, ebY+13, aw-10, 13, ebH-8);

    // ── ATK / DEF ────────────────────────────────────────────────────────────
    if (type === 'monster') {
      const adY = ebY + ebH + 3;
      this.rr(ctx, ax, adY, aw, atkH, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,0,0.3)'; ctx.lineWidth = 0.5; ctx.stroke();

      ctx.font = 'bold 13px Cinzel'; ctx.textAlign = 'right';
      if (rar === 'ur' || rar === 'utr' || rar === 'gr') {
        // gold ATK/DEF
        const ag = ctx.createLinearGradient(ax, adY, ax+aw, adY+atkH);
        ag.addColorStop(0, '#FFD700'); ag.addColorStop(0.5,'#fff8a0'); ag.addColorStop(1,'#FFD700');
        ctx.fillStyle = ag;
      } else {
        ctx.fillStyle = '#eee';
      }
      ctx.fillText(`ATK/${atk}   DEF/${def}`, ax + aw - 6, adY + 15);
    }

    // ── BOTTOM BAR ───────────────────────────────────────────────────────────
    const btY = H - py - 14;
    ctx.fillStyle = '#444'; ctx.font = '8px Cinzel'; ctx.textAlign = 'left';
    ctx.fillText('PADRE DUEL MONSTERS', px + 10, btY);
    ctx.textAlign = 'right';
    ctx.fillText(setNo, W - px - 10, btY);

    // rarity badge
    if (rar !== 'c') {
      const rarLabels = { r:'RARE', sr:'SUPER RARE', ur:'ULTRA RARE', utr:'ULTIMATE RARE', scr:'SECRET RARE', gr:'GHOST RARE' };
      ctx.textAlign = 'center';
      if (rar === 'scr') {
        const rg2 = ctx.createLinearGradient(W/2-40, btY-12, W/2+40, btY-12);
        rg2.addColorStop(0,'#ff88ff'); rg2.addColorStop(0.5,'#88ffff'); rg2.addColorStop(1,'#ff88ff');
        ctx.fillStyle = rg2;
      } else {
        ctx.fillStyle = r.outerBorder[0];
      }
      ctx.font = 'bold 8px Cinzel';
      ctx.fillText(rarLabels[rar]||'', W/2, btY - 10);
    }
  },

  // ── DOWNLOAD ──────────────────────────────────────────────────────────────
  download(filename) {
    const cv = document.getElementById('card-canvas');
    const name = filename || (document.getElementById('f-id').value || 'card') + '.png';
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = name;
    a.click();
  },

  // ── HELPERS ───────────────────────────────────────────────────────────────
  rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  },

  drawStar(ctx, cx, cy, r, c1, c2) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i * Math.PI) / 5 - Math.PI/2;
      const rad = i%2===0 ? r : r*0.42;
      ctx[i===0?'moveTo':'lineTo'](cx + Math.cos(a)*rad, cy + Math.sin(a)*rad);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(cx-r*0.2, cy-r*0.2, r*0.1, cx, cy, r);
    g.addColorStop(0, c2); g.addColorStop(1, c1);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 0.5; ctx.stroke();
  },

  wrapText(ctx, text, x, y, maxW, lineH, maxH) {
    const words = text.split(' ');
    let line = '', cy = y;
    for (const w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxW && line) {
        if (cy + lineH > y + maxH) { ctx.fillText('…', x, cy); return; }
        ctx.fillText(line.trim(), x, cy);
        line = w + ' '; cy += lineH;
      } else { line = test; }
    }
    if (line) ctx.fillText(line.trim(), x, cy);
  },

  lighten(hex, n) {
    const num = parseInt(hex.replace('#',''), 16);
    const r = Math.min(255,(num>>16)+n), g = Math.min(255,((num>>8)&0xff)+n), b = Math.min(255,(num&0xff)+n);
    return `rgb(${r},${g},${b})`;
  },
};

document.addEventListener('DOMContentLoaded', () => CM.init());
</script>
