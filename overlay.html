<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$PADRE OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>

  <div class="overlay-root" id="overlayRoot">

    <!-- Community feed panel — right side -->
    <div class="feed-panel" id="feedPanel">
      <div class="feed-header">
        <span class="feed-cross">✝</span>
        <span class="feed-title">Congregation</span>
        <span class="feed-cross">✝</span>
      </div>
      <div class="feed-list" id="feedList">
        <div class="feed-empty">awaiting the faithful…</div>
      </div>
    </div>

    <!-- Toast stack — bottom-left -->
    <div class="toast-stack" id="toastStack"></div>

    <!-- Persistent ticker at bottom -->
    <div class="overlay-ticker" id="overlayTicker">
      <span class="ot-cross">✝</span>
      <span class="ot-label">$PADRE</span>
      <span class="ot-divider">◆</span>
      <span class="ot-price" id="otPrice">Loading…</span>
      <span class="ot-cross">✝</span>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
