<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>$PADRE Rave — OBS Source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    canvas { display: block; position: absolute; top: 0; left: 0; }
    #ui {
      position: absolute; bottom: 28px; right: 44px;
      font: 600 12px 'Courier New', monospace;
      color: #fff; letter-spacing: .18em; text-transform: uppercase;
      opacity: 0.4; pointer-events: none;
    }

    /* ── BUY ALERT ── */
    #buyAlert {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      z-index: 100;
      transition: none;
    }
    #buyAlert.show {
      animation: alertIn 0.35s cubic-bezier(0.175,0.885,0.32,1.5) forwards;
    }
    #buyAlert.hide {
      animation: alertOut 0.4s ease-in forwards;
    }
    @keyframes alertIn {
      from { opacity:0; transform:translate(-50%,-50%) scale(0.5); }
      to   { opacity:1; transform:translate(-50%,-50%) scale(1); }
    }
    @keyframes alertOut {
      from { opacity:1; transform:translate(-50%,-50%) scale(1); }
      to   { opacity:0; transform:translate(-50%,-50%) scale(1.1); }
    }
    .alert-tag {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #00E676;
      text-shadow: 0 0 30px #00E676, 0 0 60px #00E676;
      margin-bottom: 12px;
    }
    .alert-main {
      font-family: 'Cinzel Decorative', serif;
      font-size: 110px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 40px #00E676, 0 0 100px rgba(0,230,118,0.5);
      letter-spacing: 0.05em;
    }
    .alert-main .alert-accent { color: #00E676; }
    .alert-value {
      font-family: 'Cinzel Decorative', serif;
      font-size: 72px;
      font-weight: 900;
      color: #00E676;
      text-shadow: 0 0 40px #00E676, 0 0 80px rgba(0,230,118,0.6);
      margin-top: 8px;
    }
    .alert-sub {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.6);
      margin-top: 14px;
      text-transform: uppercase;
    }
    .alert-divider {
      color: #00E676;
      font-size: 16px;
      letter-spacing: 8px;
      margin: 10px 0;
      text-shadow: 0 0 20px #00E676;
    }

    /* ── Scan line flash on buy ── */
    #scanFlash {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        transparent 0%, rgba(0,230,118,0.03) 50%, transparent 100%);
      background-size: 100% 4px;
      opacity: 0; pointer-events: none; z-index: 90;
      animation: none;
    }
    #scanFlash.flash { animation: scanIn 1.2s ease-out forwards; }
    @keyframes scanIn {
      0%   { opacity:0.6; }
      100% { opacity:0; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">$PADRE · trenchfather.fun</div>

<div id="scanFlash"></div>

<div id="buyAlert">
  <div class="alert-tag">✝ &nbsp; New Believer &nbsp; ✝</div>
  <div class="alert-divider">◆ ─────────── ◆ ─────────── ◆</div>
  <div class="alert-main"><span class="alert-accent">$PADRE</span> BOUGHT</div>
  <div class="alert-value" id="alertValue">0.000 SOL</div>
  <div class="alert-sub" id="alertSub">loading…</div>
  <div class="alert-divider">◆ ─────────── ◆ ─────────── ◆</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = 1920;
canvas.height = 1080;
const W = 1920, H = 1080, CX = W/2, CY = H/2;

/* ─── BPM ─── */
const BPM     = 128;
const BEAT_MS = 60000 / BPM;   // 468ms

/* ─── Palettes ─── */
const PALETTES = [
  ['#00E676','#69FF47','#00BCD4','#1DE9B6','#FFFFFF'],  // $PADRE green
  ['#00FFFF','#FF00FF','#00FF00','#FFFF00','#FF0080'],  // classic rave
  ['#FF006E','#FB5607','#FFBE0B','#8338EC','#3A86FF'],  // pop rave
  ['#FF4081','#E040FB','#7C4DFF','#40C4FF','#FFFFFF'],  // purple dream
  ['#FF6B35','#FFD700','#FF1493','#00CED1','#ADFF2F'],  // festival
];
let pi = 2, pal = PALETTES[pi];

function rc()  { return pal[Math.floor(Math.random() * pal.length)]; }
function rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

/* ─── State ─── */
let t=0, lastBeat=0, beatN=0, barN=0, lastFrame=performance.now();
let bF=0, brF=0, phF=0;   // beat / bar / phrase flash

/* ═══════════════════════════════════════════════
   PARTICLE SYSTEM — 3 layers
   Layer 0: stars (static bg, no shadow)
   Layer 1: main particles (no shadow, high volume)
   Layer 2: sparks (glow shadow, lower volume)
═══════════════════════════════════════════════ */
const MAX_MAIN  = 2400;
const MAX_SPARK = 300;
const main_p    = [];
const spark_p   = [];

class P {
  constructor(x,y,vx,vy,life,size,color,rot,vrot,type) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.life=life; this.ml=life;
    this.size=size; this.color=color;
    this.rot=rot||0; this.vrot=vrot||0;
    this.type=type||0; // 0=circle, 1=confetti rect, 2=star shape
  }
  update(dt) {
    this.x   += this.vx * dt * 0.06;
    this.y   += this.vy * dt * 0.06;
    this.vy  += 0.025 * dt;
    this.rot += this.vrot * dt;
    this.life -= dt;
  }
}

function spawnMain(x,y,vx,vy,life,size,color,type=0) {
  if (main_p.length >= MAX_MAIN) return;
  main_p.push(new P(x,y,vx,vy,life,size,color, Math.random()*Math.PI*2, (Math.random()-.5)*.04, type));
}
function spawnSpark(x,y,vx,vy,life,size,color) {
  if (spark_p.length >= MAX_SPARK) return;
  spark_p.push(new P(x,y,vx,vy,life,size,color));
}

function burst(x,y,n,spd,life,size,fn=spawnMain,type=0) {
  for (let i=0;i<n;i++) {
    const a = Math.PI*2*i/n + Math.random()*.4;
    const s = spd*(0.4+Math.random());
    fn(x,y,Math.cos(a)*s,Math.sin(a)*s, life*(0.5+Math.random()), size*(0.5+Math.random()*1.2), rc(), type);
  }
}
function burstSpark(x,y,n,spd,life,size) { burst(x,y,n,spd,life,size,spawnSpark); }

/* Confetti burst — flat coloured rects */
function burstConfetti(x,y,n) {
  for (let i=0;i<n;i++) {
    const a = Math.PI*2*Math.random();
    const s = 4+Math.random()*12;
    spawnMain(x,y,Math.cos(a)*s,Math.sin(a)*s-5, 800+Math.random()*800, 4+Math.random()*8, rc(), 1);
  }
}

/* Rain from top */
function rain(n=1) {
  for (let i=0;i<n;i++) {
    if (main_p.length >= MAX_MAIN) break;
    spawnMain(Math.random()*W, -10, (Math.random()-.5)*3, 5+Math.random()*10,
      350+Math.random()*500, 2+Math.random()*3, rc(), 0);
  }
}

/* Edge spray */
function edgeSpray() {
  const sides = [[0,Math.random()*H,8,0],[W,Math.random()*H,-8,0],
                 [Math.random()*W,0,0,8],[Math.random()*W,H,0,-8]];
  sides.forEach(([x,y,bx,by]) => {
    for (let i=0;i<12;i++) {
      spawnMain(x,y, bx+(Math.random()-.5)*6, by+(Math.random()-.5)*6,
        600+Math.random()*400, 3+Math.random()*4, rc());
    }
  });
}

/* Firework */
function firework() {
  const x = W*0.1 + Math.random()*W*0.8;
  const y = H*0.05 + Math.random()*H*0.5;
  burstSpark(x,y, 60, 16, 900, 5);
  burst(x,y, 80, 10, 700, 3);
}

/* Draw all particles */
function drawParticles() {
  // Main particles — no shadow, batched by type for performance
  main_p.forEach(p => {
    const a = Math.max(0, p.life/p.ml);
    const [r,g,b] = rgb(p.color);
    ctx.globalAlpha = a;
    if (p.type===1) {
      // confetti rectangle
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*a+0.5, 0, Math.PI*2);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fill();
    }
  });

  // Spark particles — with glow
  spark_p.forEach(p => {
    const a = Math.max(0, p.life/p.ml);
    const [r,g,b] = rgb(p.color);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*a+0.5, 0, Math.PI*2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = p.size * 6;
    ctx.fill();
    ctx.shadowBlur  = 0;
  });

  ctx.globalAlpha = 1;
}

/* ═══════════════════════════════════════════════
   STARS — static twinkling background
═══════════════════════════════════════════════ */
const STARS = Array.from({length:400}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  s: 0.5+Math.random()*2,
  phase: Math.random()*Math.PI*2,
  spd: 0.001+Math.random()*0.003,
}));

function drawStars() {
  STARS.forEach(s => {
    s.phase += s.spd * 16;
    const a = 0.2 + Math.sin(s.phase) * 0.3 + bF * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0,a)})`;
    ctx.fill();
  });
}

/* ═══════════════════════════════════════════════
   SHOCKWAVE RINGS
═══════════════════════════════════════════════ */
const rings = [];
function spawnRing(x,y,color,speed=2.5,maxR=900) {
  rings.push({x,y,r:10,speed,maxR,color,life:1});
}
function updateRings(dt) {
  for (let i=rings.length-1;i>=0;i--) {
    const rg = rings[i];
    rg.r += rg.speed * dt * 0.06 * 60;
    rg.life = Math.max(0, 1 - rg.r/rg.maxR);
    if (rg.life <= 0) { rings.splice(i,1); continue; }
    const [r,g,b] = rgb(rg.color);
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${rg.life*0.8})`;
    ctx.lineWidth = 3 * rg.life;
    ctx.shadowColor = rg.color;
    ctx.shadowBlur  = 20 * rg.life;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

/* ═══════════════════════════════════════════════
   LASERS — 20 from center
═══════════════════════════════════════════════ */
const lasers = Array.from({length:20}, (_,i) => ({
  angle: Math.PI*2*i/20,
  speed: (Math.random()>.5?1:-1)*(0.2+Math.random()*0.5),
  color: pal[i%pal.length],
  w: 1+Math.random()*2.5,
  len: 0.3+Math.random()*0.7,
}));

function drawLasers(dt) {
  const pulse = 1 + bF*0.6;
  lasers.forEach(l => {
    l.angle += l.speed*dt*0.001;
    const len = Math.min(W,H)*0.75*l.len*pulse;
    const x2  = CX+Math.cos(l.angle)*len;
    const y2  = CY+Math.sin(l.angle)*len;
    const [r,g,b] = rgb(l.color);
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.55+bF*0.45})`;
    ctx.lineWidth   = l.w*pulse;
    ctx.shadowColor = l.color;
    ctx.shadowBlur  = 18+bF*50;
    ctx.stroke();
    ctx.shadowBlur  = 0;
  });
}

/* ═══════════════════════════════════════════════
   CORNER SPOTLIGHTS — 4 sweeping beams from corners
═══════════════════════════════════════════════ */
const spots = [
  {x:0,   y:0,   angle:0.6,  speed: 0.25, color:'#FF006E'},
  {x:W,   y:0,   angle:2.5,  speed:-0.3,  color:'#00FFFF'},
  {x:0,   y:H,   angle:-0.6, speed: 0.2,  color:'#FFBE0B'},
  {x:W,   y:H,   angle:3.8,  speed:-0.22, color:'#8338EC'},
];
function drawSpotlights(dt) {
  spots.forEach(s => {
    s.angle += s.speed*dt*0.001;
    const len = 1600;
    const spread = 0.04 + bF*0.04;
    const x2 = s.x + Math.cos(s.angle)*len;
    const y2 = s.y + Math.sin(s.angle)*len;
    const [r,g,b] = rgb(s.color);
    const grad = ctx.createLinearGradient(s.x, s.y, x2, y2);
    grad.addColorStop(0,   `rgba(${r},${g},${b},${0.35+bF*0.3})`);
    grad.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x+Math.cos(s.angle-spread)*len, s.y+Math.sin(s.angle-spread)*len);
    ctx.lineTo(s.x+Math.cos(s.angle+spread)*len, s.y+Math.sin(s.angle+spread)*len);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.shadowColor = s.color;
    ctx.shadowBlur  = 30+bF*40;
    ctx.fill();
    ctx.shadowBlur  = 0;
    ctx.restore();
  });
}

/* ═══════════════════════════════════════════════
   TUNNEL
═══════════════════════════════════════════════ */
let tunOff=0;
function drawTunnel(dt) {
  tunOff = (tunOff + dt*0.18) % 80;
  for (let i=20;i>=0;i--) {
    const d = ((i/20)+tunOff/80)%1;
    const r = d*Math.min(W,H)*0.85;
    if (r<=0) continue;
    const ci = Math.floor((d*pal.length+beatN)%pal.length);
    const [cr,cg,cb] = rgb(pal[ci]);
    const a = (1-d)*0.18+brF*0.12;
    ctx.beginPath();
    ctx.arc(CX,CY,r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a})`;
    ctx.lineWidth   = 1.5;
    ctx.shadowColor = pal[ci];
    ctx.shadowBlur  = 10;
    ctx.stroke();
    ctx.shadowBlur  = 0;
  }
}

/* ═══════════════════════════════════════════════
   GRID FLOOR
═══════════════════════════════════════════════ */
let gz=0;
function drawGrid(dt) {
  gz = (gz + dt*0.07)%80;
  const HRZ = H*0.6, FLOOR=H, LINES=28;
  const gc = pal[0];
  const [r,g,b] = rgb(gc);
  ctx.save();
  ctx.strokeStyle = `rgba(${r},${g},${b},${0.15+bF*0.2})`;
  ctx.lineWidth   = 1;
  ctx.shadowColor = gc;
  ctx.shadowBlur  = 8;
  for (let i=0;i<=LINES;i++) {
    const pct = (i/LINES+gz/80)%1;
    const y   = HRZ+(FLOOR-HRZ)*(pct*pct);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for (let i=0;i<=LINES;i++) {
    const x=(i/LINES)*W;
    ctx.beginPath(); ctx.moveTo(CX,HRZ); ctx.lineTo(x,FLOOR); ctx.stroke();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════
   CENTER CROSS
═══════════════════════════════════════════════ */
let cRot=0;
function drawCross(dt) {
  cRot += dt*0.001*(1+bF*2);
  const sz    = 90+bF*60+brF*30;
  const color = pal[beatN%pal.length];
  ctx.save();
  ctx.translate(CX, CY*0.5);
  ctx.rotate(cRot);
  ctx.font         = `bold ${sz}px serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = color;
  ctx.globalAlpha  = 0.75+bF*0.25;
  ctx.shadowColor  = color;
  ctx.shadowBlur   = 50+bF*80;
  ctx.fillText('✝',0,0);
  ctx.restore();
}

/* ═══════════════════════════════════════════════
   $PADRE TITLE
═══════════════════════════════════════════════ */
let tA=0, tTgt=0;
function drawTitle() {
  tA += (tTgt-tA)*0.04;
  if (tA<0.01) return;
  const c = pal[0];
  const [r,g,b] = rgb(c);
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 160px Arial Black';
  ctx.fillStyle=`rgba(${r},${g},${b},${tA*0.95})`;
  ctx.shadowColor=c; ctx.shadowBlur=100;
  ctx.fillText('$PADRE',CX,CY*0.5);
  ctx.restore();
}

/* ═══════════════════════════════════════════════
   STROBE
═══════════════════════════════════════════════ */
function drawStrobe() {
  const a = Math.max(bF,brF)*0.18;
  if (a<0.02) return;
  ctx.fillStyle=`rgba(255,255,255,${a})`;
  ctx.fillRect(0,0,W,H);
}

/* ═══════════════════════════════════════════════
   BACKGROUND
═══════════════════════════════════════════════ */
function drawBg() {
  const hue=(t*0.006)%360, hue2=(hue+140)%360, hue3=(hue+280)%360;
  const grad=ctx.createRadialGradient(CX,CY*0.5,0,CX,CY,Math.max(W,H)*0.8);
  grad.addColorStop(0,  `hsla(${hue},  90%, 7%, 1)`);
  grad.addColorStop(0.4,`hsla(${hue2}, 70%, 4%, 1)`);
  grad.addColorStop(1,  `hsla(${hue3}, 50%, 2%, 1)`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

/* ═══════════════════════════════════════════════
   BEAT / BAR / PHRASE EVENTS
═══════════════════════════════════════════════ */
let nextFirework = 2000;

function onBeat() {
  beatN++; bF=1;
  // center burst
  burst(CX, CY*0.5, 20, 9, 550, 4);
  burstSpark(CX, CY*0.5, 8, 7, 400, 5);
  // ring
  spawnRing(CX, CY, rc(), 2.8, 1000);
  // heavy rain
  rain(12);
  if (beatN % 4 === 0) onBar();
}

function onBar() {
  barN++; brF=1;
  // big center burst
  burst(CX, CY, 50, 14, 1000, 6);
  burstSpark(CX, CY, 20, 12, 800, 7);
  burstConfetti(CX, CY*0.3, 40);
  // edge spray
  edgeSpray();
  // rings from corners
  [[0,0],[W,0],[0,H],[W,H]].forEach(([x,y]) => spawnRing(x,y,rc(),2,900));
  // rain burst
  rain(30);

  if (barN % 4 === 0) {
    pi = (pi+1)%PALETTES.length;
    pal = PALETTES[pi];
    lasers.forEach((l,i)=>l.color=pal[i%pal.length]);
    spots.forEach((s,i)=>s.color=pal[i%pal.length]);
    onPhrase();
  }
  if (barN % 8 === 0) {
    tTgt=1; setTimeout(()=>{tTgt=0;},3500);
  }
}

function onPhrase() {
  phF=1;
  // huge corner blasts
  [[0,0],[W,0],[0,H],[W,H],[CX,0],[0,CY],[W,CY],[CX,H]].forEach(([x,y])=>{
    burst(x,y,50,16,1400,7);
    burstSpark(x,y,20,14,1000,8);
    spawnRing(x,y,rc(),3.5,1400);
  });
  burstConfetti(CX,CY,100);
  rain(60);
}

/* ═══════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════ */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now-lastFrame, 50);
  lastFrame=now; t+=dt;

  // beat clock
  if (t-lastBeat >= BEAT_MS) { lastBeat+=BEAT_MS; onBeat(); }

  // random fireworks
  if (t > nextFirework) {
    firework();
    nextFirework = t + 1500 + Math.random()*3000;
  }

  // continuous heavy rain
  if (Math.random()<0.8) rain(3);

  // decay flashes
  bF  = Math.max(0, bF  - dt*0.009);
  brF = Math.max(0, brF - dt*0.004);
  phF = Math.max(0, phF - dt*0.001);

  // update particles
  for (let i=main_p.length-1;i>=0;i--) {
    main_p[i].update(dt);
    if (main_p[i].life<=0) main_p.splice(i,1);
  }
  for (let i=spark_p.length-1;i>=0;i--) {
    spark_p[i].update(dt);
    if (spark_p[i].life<=0) spark_p.splice(i,1);
  }

  // DRAW
  drawBg();
  drawStars();
  drawGrid(dt);
  drawTunnel(dt);
  drawSpotlights(dt);
  drawLasers(dt);
  updateRings(dt);
  drawParticles();
  drawCross(dt);
  drawTitle();
  drawStrobe();
}

// Show title on load
setTimeout(()=>{tTgt=1;setTimeout(()=>{tTgt=0;},4500);},400);
// Kick off a phrase immediately so it looks full right away
setTimeout(()=>{ onBeat();onBeat();onBeat();onBeat();onBar();onPhrase(); },100);
requestAnimationFrame(frame);

/* ═══════════════════════════════════════════════
   BUY ALERT — HTTP polling (no WS needed)
   Polls getSignaturesForAddress every 5s,
   parses new txns for buys
═══════════════════════════════════════════════ */
const CA        = (window.PADRE_CA) || 'HNVYhd7CMfCYDgDiRBKzx1gvZVqYohjMMFmRS1n8pump';
const SOL_RPC   = 'https://api.mainnet-beta.solana.com';
const alertEl   = document.getElementById('buyAlert');
const alertValue= document.getElementById('alertValue');
const alertSub  = document.getElementById('alertSub');
const scanFlash = document.getElementById('scanFlash');
let alertTimer  = null;
let processingTx= false;
const seenSigs  = new Set();


function showBuyAlert(priceStr, mcStr, wallet, _unused) {
  if (alertTimer) clearTimeout(alertTimer);
  alertEl.classList.remove('show','hide');

  alertValue.textContent = priceStr || '—';
  alertSub.textContent   = mcStr ? 'Market Cap · ' + mcStr : '$PADRE';

  // Force reflow then show
  void alertEl.offsetWidth;
  alertEl.classList.add('show');

  // Trigger canvas explosion
  onPhrase();
  burstSpark(CX, CY, 80, 20, 1400, 10);
  burst(CX, CY, 120, 18, 1200, 8);
  [[0,0],[W,0],[0,H],[W,H]].forEach(([x,y]) => {
    spawnRing(x,y,pal[0],4,1600);
    burst(x,y,60,16,1200,7);
  });
  rain(80);

  // Scan line flash
  scanFlash.classList.remove('flash');
  void scanFlash.offsetWidth;
  scanFlash.classList.add('flash');

  alertTimer = setTimeout(() => {
    alertEl.classList.remove('show');
    alertEl.classList.add('hide');
    alertTimer = setTimeout(() => alertEl.classList.remove('hide'), 500);
  }, 5000);
}

let solPrice = 0;

// DexScreener polling — tracks buy count changes every 8s
let lastBuyCount = -1;
let lastPrice    = 0;
let lastMC       = 0;

async function pollDex() {
  try {
    const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${CA}`);
    const d = await r.json();
    const p = d?.pairs?.[0];
    if (!p) return;

    // Update sol price
    if (p.priceNative && p.priceUsd)
      solPrice = parseFloat(p.priceUsd) / parseFloat(p.priceNative);

    const buys5m = p.txns?.m5?.buys ?? 0;
    const price  = parseFloat(p.priceUsd || 0);
    const mc     = p.fdv || 0;

    // First poll — just seed the count, don't alert
    if (lastBuyCount === -1) {
      lastBuyCount = buys5m;
      lastPrice    = price;
      lastMC       = mc;
      console.log('[rave] DexScreener ready — watching buys (current m5:', buys5m, ')');
      return;
    }

    // Detect new buys — count increased OR price went up (catches count resets)
    const newBuys = buys5m > lastBuyCount || (buys5m === 0 && lastBuyCount > 0 && price > lastPrice);
    if (newBuys) {
      const diff = buys5m > lastBuyCount ? buys5m - lastBuyCount : 1;
      const mcStr = mc >= 1e6 ? '$'+(mc/1e6).toFixed(2)+'M'
                  : mc >= 1e3 ? '$'+(mc/1e3).toFixed(0)+'K'
                  : mc > 0 ? '$'+mc.toFixed(0) : '—';
      const priceStr = price > 0 ? '$'+price.toFixed(8) : '—';
      // Show alert for each new buy (cap at 3 to avoid spam)
      for (let i = 0; i < Math.min(diff, 3); i++) {
        setTimeout(() => showBuyAlert(priceStr, mcStr, null, 0), i * 1800);
      }
      console.log('[rave] Buy detected! m5 buys:', lastBuyCount, '→', buys5m);
    }

    lastBuyCount = buys5m;
    lastPrice    = price;
    lastMC       = mc;
  } catch(e) {
    console.warn('[rave] dex poll error:', e.message);
  }
}

setInterval(pollDex, 8000);
pollDex();

/* ─── Keys ─── */

  if (e.key==='ArrowUp')   { pi=(pi+1)%PALETTES.length; pal=PALETTES[pi]; lasers.forEach((l,i)=>l.color=pal[i%pal.length]); }
  if (e.key==='ArrowDown') { firework(); firework(); }
  if (e.key==='f'||e.key==='F') { onPhrase(); }
  if (e.key==='b'||e.key==='B') { showBuyAlert('$0.00000842', '$5.4K', null, 0); } // test buy alert
});
