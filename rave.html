<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>$PADRE Rave — OBS Source</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px;
      overflow: hidden;
      background: #000;
      font-family: 'Arial Black', sans-serif;
    }
    canvas { display: block; position: absolute; top: 0; left: 0; }
    #ui {
      position: absolute;
      bottom: 32px; right: 48px;
      display: flex; gap: 12px; align-items: center;
      opacity: 0.5;
      font-size: 13px;
      color: #ffffff;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">$PADRE · trenchfather.fun</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = 1920;
canvas.height = 1080;

const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;

/* ── BPM config (128 default — house/techno) ── */
const BPM       = 128;
const BEAT_MS   = 60000 / BPM;        // ~468ms
const BAR_MS    = BEAT_MS * 4;        // ~1875ms
const PHRASE_MS = BAR_MS  * 8;        // ~15000ms

/* ── Colour palette ── */
const PALETTES = [
  ['#FF006E','#FB5607','#FFBE0B','#8338EC','#3A86FF'],  // pop rave
  ['#00FFFF','#FF00FF','#00FF00','#FFFF00','#FF0080'],  // classic rave
  ['#00E676','#69FF47','#00BCD4','#1DE9B6','#FFFFFF'],  // $PADRE green
  ['#FF4081','#E040FB','#7C4DFF','#40C4FF','#FFFFFF'],  // purple dream
  ['#FF6B35','#F7C59F','#EFEFD0','#004E89','#1A936F'],  // sunset
];
let paletteIdx = 2; // start on $PADRE green
let palette    = PALETTES[paletteIdx];

function randColor() { return palette[Math.floor(Math.random() * palette.length)]; }
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

/* ── State ── */
let t          = 0;      // ms since start
let lastBeat   = 0;
let beatCount  = 0;
let barCount   = 0;
let phraseCount= 0;
let beatFlash  = 0;      // 0-1, decays
let barFlash   = 0;
let phraseFlash= 0;
let lastFrame  = performance.now();

/* ── Particles ── */
const MAX_P = 800;
const particles = [];
class Particle {
  constructor(x,y,vx,vy,life,size,color) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.life=life; this.maxLife=life;
    this.size=size; this.color=color;
  }
  update(dt) {
    this.x  += this.vx * dt * 0.06;
    this.y  += this.vy * dt * 0.06;
    this.vy += 0.02 * dt;  // slight gravity
    this.life -= dt;
  }
  draw() {
    const a = Math.max(0, this.life / this.maxLife);
    const [r,g,b] = hexToRgb(this.color);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.shadowColor = this.color;
    ctx.shadowBlur  = this.size * 4;
    ctx.fill();
    ctx.shadowBlur  = 0;
  }
}

function spawnBurst(x, y, count, speed, life, size) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_P) break;
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const s     = speed * (0.5 + Math.random());
    particles.push(new Particle(x, y, Math.cos(angle)*s, Math.sin(angle)*s,
      life * (0.6+Math.random()*0.8), size*(0.5+Math.random()), randColor()));
  }
}

function spawnRain() {
  if (particles.length >= MAX_P) return;
  const x = Math.random() * W;
  const c = randColor();
  particles.push(new Particle(x, -10, (Math.random()-0.5)*2, 4+Math.random()*8,
    400+Math.random()*600, 2+Math.random()*3, c));
}

/* ── Lasers ── */
const NUM_LASERS = 12;
const lasers = Array.from({length: NUM_LASERS}, (_, i) => ({
  angle: (Math.PI * 2 * i) / NUM_LASERS,
  speed: (Math.random() > 0.5 ? 1 : -1) * (0.3 + Math.random() * 0.4),
  color: PALETTES[2][i % PALETTES[2].length],
  width: 1 + Math.random() * 2,
  length: 0.4 + Math.random() * 0.6,
}));

function drawLasers(dt) {
  const beatPulse = 1 + beatFlash * 0.5;
  lasers.forEach((l, i) => {
    l.angle += l.speed * dt * 0.001;
    const len = (Math.min(W,H) * 0.7 * l.length) * beatPulse;
    const x2  = CX + Math.cos(l.angle) * len;
    const y2  = CY + Math.sin(l.angle) * len;
    const [r,g,b] = hexToRgb(l.color);
    const alpha = 0.6 + beatFlash * 0.4;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = l.width * beatPulse;
    ctx.shadowColor = l.color;
    ctx.shadowBlur  = 20 + beatFlash * 40;
    ctx.stroke();
    ctx.restore();
  });
}

/* ── Tunnel ── */
let tunnelOffset = 0;
function drawTunnel(dt) {
  tunnelOffset = (tunnelOffset + dt * 0.15) % 80;
  const rings = 16;
  for (let i = rings; i >= 0; i--) {
    const d = ((i / rings) + tunnelOffset / 80) % 1;
    const r = d * Math.min(W, H) * 0.8;
    if (r <= 0) continue;
    const colorIdx = Math.floor((d * palette.length + beatCount) % palette.length);
    const [cr,cg,cb] = hexToRgb(palette[colorIdx]);
    const alpha = (1 - d) * 0.15 + barFlash * 0.1;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    ctx.lineWidth   = 1.5;
    ctx.shadowColor = palette[colorIdx];
    ctx.shadowBlur  = 8;
    ctx.stroke();
    ctx.shadowBlur  = 0;
  }
}

/* ── Grid floor ── */
let gridZ = 0;
function drawGrid(dt) {
  gridZ = (gridZ + dt * 0.05) % 80;
  const LINES = 20;
  const HORIZON = H * 0.62;
  const FLOOR   = H;
  ctx.save();
  ctx.strokeStyle = `rgba(0,230,118,${0.12 + beatFlash * 0.15})`;
  ctx.lineWidth   = 1;
  ctx.shadowColor = '#00E676';
  ctx.shadowBlur  = 6;

  // horizontal lines
  for (let i = 0; i <= LINES; i++) {
    const pct = (i / LINES + gridZ / 80) % 1;
    const y   = HORIZON + (FLOOR - HORIZON) * (pct * pct);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  // vertical lines
  for (let i = 0; i <= LINES; i++) {
    const x = (i / LINES) * W;
    ctx.beginPath();
    ctx.moveTo(CX, HORIZON);
    ctx.lineTo(x, FLOOR);
    ctx.stroke();
  }
  ctx.restore();
}

/* ── Center cross / logo ── */
let crossRot = 0;
function drawCross(dt) {
  crossRot += dt * 0.0008 * (1 + beatFlash);
  const size  = 80 + beatFlash * 40 + barFlash * 20;
  const alpha = 0.7 + beatFlash * 0.3;
  const color = palette[beatCount % palette.length];

  ctx.save();
  ctx.translate(CX, CY * 0.52);
  ctx.rotate(crossRot);
  ctx.font = `bold ${size}px serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = color;
  ctx.globalAlpha  = alpha;
  ctx.shadowColor  = color;
  ctx.shadowBlur   = 40 + beatFlash * 60;
  ctx.fillText('✝', 0, 0);
  ctx.restore();
}

/* ── $PADRE text pulse ── */
let textAlpha  = 0;
let textTarget = 0;
function drawTitle() {
  textAlpha += (textTarget - textAlpha) * 0.05;
  if (textAlpha < 0.01) return;
  const color = palette[0];
  const [r,g,b] = hexToRgb(color);
  ctx.save();
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.font         = 'bold 140px Arial Black';
  ctx.letterSpacing = '0.2em';
  ctx.fillStyle    = `rgba(${r},${g},${b},${textAlpha * 0.9})`;
  ctx.shadowColor  = color;
  ctx.shadowBlur   = 80;
  ctx.fillText('$PADRE', CX, CY * 0.52 + 10);
  ctx.shadowBlur   = 0;
  ctx.restore();
}

/* ── Strobe flash ── */
function drawStrobe() {
  if (beatFlash < 0.05 && barFlash < 0.05) return;
  const a = Math.max(beatFlash, barFlash) * 0.15;
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.fillRect(0, 0, W, H);
}

/* ── Background colour shift ── */
function drawBackground() {
  const hue  = (t * 0.006) % 360;
  const hue2 = (hue + 120) % 360;
  const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W,H) * 0.7);
  grad.addColorStop(0,   `hsla(${hue}, 80%, 8%, 1)`);
  grad.addColorStop(0.5, `hsla(${hue2}, 60%, 4%, 1)`);
  grad.addColorStop(1,   `rgba(0,0,0,1)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

/* ── Beat handler ── */
function onBeat() {
  beatCount++;
  beatFlash = 1;
  spawnBurst(CX, CY * 0.52, 16, 8, 500, 4);
  for (let i = 0; i < 6; i++) spawnRain();

  if (beatCount % 4 === 0) onBar();
}

function onBar() {
  barCount++;
  barFlash = 1;
  spawnBurst(CX, CY, 40, 14, 900, 6);

  // swap palette every 4 bars
  if (barCount % 4 === 0) {
    paletteIdx = (paletteIdx + 1) % PALETTES.length;
    palette    = PALETTES[paletteIdx];
    lasers.forEach((l, i) => l.color = palette[i % palette.length]);
    onPhrase();
  }

  // show title every 8 bars
  if (barCount % 8 === 0) {
    textTarget = 1;
    setTimeout(() => { textTarget = 0; }, 3000);
  }
}

function onPhrase() {
  phraseCount++;
  phraseFlash = 1;
  // big burst from corners
  [[0,0],[W,0],[0,H],[W,H]].forEach(([x,y]) => spawnBurst(x,y,30,12,1200,5));
}

/* ── Main loop ── */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - lastFrame, 50); // cap at 50ms to avoid spiral
  lastFrame = now;
  t += dt;

  // Beat detection (clock-based)
  if (t - lastBeat >= BEAT_MS) {
    lastBeat += BEAT_MS;
    onBeat();
  }

  // Decay flashes
  beatFlash   = Math.max(0, beatFlash   - dt * 0.008);
  barFlash    = Math.max(0, barFlash    - dt * 0.003);
  phraseFlash = Math.max(0, phraseFlash - dt * 0.001);

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Continuous rain
  if (Math.random() < 0.3) spawnRain();

  // Draw
  drawBackground();
  drawGrid(dt);
  drawTunnel(dt);
  drawLasers(dt);

  // Particles
  ctx.save();
  particles.forEach(p => p.draw());
  ctx.restore();

  drawCross(dt);
  drawTitle();
  drawStrobe();
}

// Kick off showing title on load
setTimeout(() => { textTarget = 1; setTimeout(() => { textTarget = 0; }, 4000); }, 500);
requestAnimationFrame(frame);

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    // manual beat trigger
    lastBeat = t;
    onBeat();
  }
  if (e.key === 'ArrowUp') {
    // palette cycle
    paletteIdx = (paletteIdx + 1) % PALETTES.length;
    palette    = PALETTES[paletteIdx];
    lasers.forEach((l, i) => l.color = palette[i % palette.length]);
  }
});
</script>
</body>
</html>
